# Запуск: из корня репо (где лежит 3b-adapter/), файл .env с ключами рядом.
services:
  llm:
    # ЗАФИКСИРУЙ конкретную версию вместо latest после проверки
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-3B-Instruct
      --enable-lora
      --lora-modules phishing=/adapters/3b-adapter
      --max-lora-rank 8
      --max-model-len 2048
      --api-key ${VLLM_API_KEY}
    volumes:
      - ../3b-adapter:/adapters/3b-adapter:ro
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # порт наружу НЕ публикуем - к модели ходит только api

  api:
    build: ./api
    environment:
      VLLM_URL: http://llm:8000/v1/chat/completions
      VLLM_API_KEY: ${VLLM_API_KEY}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
    volumes:
      - ../3b-adapter:/adapters/3b-adapter:ro
    ports:
      - "127.0.0.1:8080:8080"   # наружу только через nginx + HTTPS
    depends_on:
      - llm

volumes:
  hf-cache:
